name: Swap in the F-Droid pubspec
description: >
  Back up the real pubspec.yaml/pubspec.lock, then replace them with the
  committed, pre-resolved F-Droid variants and resolve once. Used by the
  F-Droid build and by the Pro/Alpha builds, which ship without Google Play
  Billing. Oinkoin has no billing dependency any more, so these variants match
  the real manifest; the swap is kept so the F-Droid recipe and the CI jobs
  keep using the same pinned pair. Pair with the restore-real-pubspec action
  once the build is done.

runs:
  using: composite
  steps:
    - name: Swap in the F-Droid pubspec
      run: |
        cp pubspec.yaml pubspec.yaml.bak
        cp pubspec.lock pubspec.lock.bak
        cp pubspec.yaml.fdroid pubspec.yaml
        cp pubspec.lock.fdroid pubspec.lock
        submodules/flutter/bin/flutter pub get
      shell: bash
