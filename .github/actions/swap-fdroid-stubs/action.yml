name: Swap in F-Droid stub dependencies
description: >
  Back up the real pubspec.yaml/pubspec.lock, then replace them with the
  committed, pre-resolved F-Droid stub variants (no proprietary Google Play
  Billing) and resolve once. Used by every CI build that needs the same
  no-op in_app_purchase as the F-Droid build: Pro and Alpha. Pair with the
  restore-real-pubspec action once the stubbed build is done.

runs:
  using: composite
  steps:
    - name: Swap in F-Droid stub dependencies
      run: |
        cp pubspec.yaml pubspec.yaml.bak
        cp pubspec.lock pubspec.lock.bak
        cp pubspec.yaml.fdroid pubspec.yaml
        cp pubspec.lock.fdroid pubspec.lock
        submodules/flutter/bin/flutter pub get
      shell: bash
