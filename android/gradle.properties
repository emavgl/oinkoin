org.gradle.jvmargs=-Xmx3536M
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added by the Flutter template.
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Keep Android versionCodes fully under this app's control. Flutter's
# split-per-ABI versionCode override changed and, combined with the
# versionCode formula below, produced codes that no longer matched F-Droid's
# VercodeOperation. With this flag Flutter leaves versionCode alone and
# android/app/build.gradle applies the scheme F-Droid expects.
force-version-code-ignoring-abi=true
